<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Syntaxwear</title>

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">

</head>

<body>
    <header class="site-header">
        <div class="container">
            <a class="logo" href="#" aria-label="Syntaxwear home">Syntaxwear</a>

            <nav class="main-nav" aria-label="Navegação principal">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Masculino</a></li>
                    <li><a href="#">Feminino</a></li>
                    <li><a href="#">Categorias</a></li>
                    <li><a href="#">Ofertas</a></li>
                </ul>
            </nav>

            <div class="header-actions" aria-label="Ações do usuário">
                <a href="#">Buscar</a>
                <a href="#">Carrinho</a>
            </div>
        </div>
    </header>

    <main>
        <section class="hero" aria-label="Seção principal de destaque">
            <div class="container">
                <div class="hero__content"></div>
            </div>
        </section>

        <section class="categories" aria-labelledby="categories-title">
            <div class="container">
                <header class="section-header">
                    <h2 id="categories-title">Categorias de tênis</h2>
                </header>

                <div class="category-list">
                    <article class="category-item" aria-label="Categoria de tênis 1"></article>
                    <article class="category-item" aria-label="Categoria de tênis 2"></article>
                    <article class="category-item" aria-label="Categoria de tênis 3"></article>
                    <article class="category-item" aria-label="Categoria de tênis 4"></article>
                </div>
            </div>
        </section>

        <section class="featured-products" aria-labelledby="featured-products-title">
            <div class="container">
                <header class="section-header">
                    <h2 id="featured-products-title">Produtos em destaque</h2>
                </header>

                <div class="product-grid">
                    <article class="product-card" aria-label="Produto em destaque 1"></article>
                    <article class="product-card" aria-label="Produto em destaque 2"></article>
                    <article class="product-card" aria-label="Produto em destaque 3"></article>
                    <article class="product-card" aria-label="Produto em destaque 4"></article>
                    <article class="product-card" aria-label="Produto em destaque 5"></article>
                    <article class="product-card" aria-label="Produto em destaque 6"></article>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-brand">
                <a href="#" class="logo">Syntaxwear</a>
            </div>

            <div class="footer-links">
                <nav aria-label="Links úteis">
                    <h3>Links</h3>
                    <ul>
                        <li><a href="#">Sobre nós</a></li>
                        <li><a href="#">Loja</a></li>
                        <li><a href="#">FAQ</a></li>
                        <li><a href="#">Contato</a></li>
                    </ul>
                </nav>
            </div>

            <div class="footer-contact">
                <h3>Contato</h3>
                <ul>
                    <li><a href="mailto:contato@syntaxwear.com">contato@syntaxwear.com</a></li>
                    <li><a href="tel:+5511999999999">(11) 99999-9999</a></li>
                    <li>São Paulo, SP</li>
                </ul>
            </div>
        </div>
    </footer>
</body>

</html>
